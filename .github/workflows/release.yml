name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # Recovery may improve registry verification without moving an immutable
      # release tag. Only this helper comes from the reviewed workflow commit;
      # package source, versions and archives still come from RELEASE_TAG.
      - name: Load publishing helper from this workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --depth=1 origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:scripts/publish-release.mjs" > scripts/publish-release.mjs
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Set up npm with trusted publishing support
        run: pnpm add --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify tag matches every package version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          version="${RELEASE_TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          for package in extensions server react ui cli; do
            test "$(node -p "require('./packages/$package/package.json').version")" = "$version"
          done
      - name: Build release archives
        run: pnpm pack:release "$GITHUB_WORKSPACE/release"
      - name: Preserve candidate archives for inspection and recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: release/
          retention-days: 30
      - name: Publish npm packages through OIDC
        run: node scripts/publish-release.mjs "$GITHUB_WORKSPACE/release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its assets."
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
          fi
